spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///fuelmatch_nutrition_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

  cache:
    type: simple   # Cache em memória nos testes (sem Redis)

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.fuelmatch.nutrition: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

integration:
  open-food-facts:
    base-url: http://localhost:8089   # WireMock nos testes de integração
    timeout-seconds: 2
    enabled: true
